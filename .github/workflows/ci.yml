name: Warehouse build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (cache maven)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Ensure Sonar cache dir exists
        run: mkdir -p ~/.sonar/cache

      - name: Cache Sonar packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, test
        run: mvn -B -U -ntp clean verify

      - name: SonarCloud analysis (Maven plugin)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp sonar:sonar

      - name: Build image with Maven profile
        run: mvn -B -DskipTests -P docker package

      - name: Health check
        run: |
          docker compose up -d
          sleep 100
          curl -f http://localhost:6565/swagger-ui/index.html#/

      - name: Stop compose
        if: always()
        run: docker compose down -v

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
